_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:54321
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - HEAD
            - PUT
            - PATCH
            - POST
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - apikey
            - X-Client-Info
            - Prefer
          exposed_headers:
            - X-Total-Count
            - Content-Range
          credentials: true
          max_age: 3600

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - HEAD
            - PUT
            - PATCH
            - POST
            - DELETE
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - apikey
            - X-Client-Info
            - Prefer
          exposed_headers:
            - X-Total-Count
            - Content-Range
          credentials: true
          max_age: 3600
